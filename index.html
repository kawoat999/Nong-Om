<!DOCTYPE html>
<html lang="th">
<head>

    <meta name="description" content="บันทึกรายรับ-รายจ่ายได้ง่ายๆ ด้วยระบบ Gamification ที่ทำให้การจัดการการเงินเป็นเรื่องสนุก">
    <meta name="keywords" content="finance, expense tracker, gamification, การเงิน, บันทึกรายจ่าย">
    <meta name="author" content="FinGame">
    
    <!-- Open Graph -->
    <meta property="og:title" content="FinGame - จัดการเงินแบบเกมให้สนุก!">
    <meta property="og:description" content="บันทึกรายรับ-รายจ่ายได้ง่ายๆ ด้วยระบบ Gamification">
    <meta property="og:type" content="website">
    
    <!-- Favicon (Emoji fallback) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles/main.css">
    
    <!-- Page Transition Styles -->
    <style>
        #app {
            transition: opacity 0.15s ease;
        }
        #app.fade-out {
            opacity: 0;
        }
        #app.fade-in {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- App Container -->
    <div id="app">
        <!-- Loading State -->
        <div class="hero" style="min-height: 100vh;">
            <div class="text-center">
                <div class="spinner" style="margin: 0 auto var(--spacing-lg);"></div>
                <p style="color: var(--color-text-muted);">กำลังโหลด...</p>
            </div>
        </div>
    </div>

    <!-- ============================================================
         JAVASCRIPT FILES
         
         Load Order:
         1. Utilities (no dependencies)
         2. Components (may use utilities)
         3. Pages (use utilities and components)
         4. App (initializes everything)
         ============================================================ -->
    
    <!-- Utilities -->
    <script src="js/utils/router.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/utils/api.js"></script>
    
    <!-- Components -->
    <script src="js/components/modal.js"></script>
    
    <!-- Pages -->
    <script src="js/pages/landing.js"></script>
    <script src="js/pages/auth.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/game.js"></script>
    
    <!-- Main App -->
    <script src="js/app.js"></script>
</body>
</html>
